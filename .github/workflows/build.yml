name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and agbcc
        run: bash tools/setup-cloud.sh

      - name: Build classic (agbcc)
        run: make -j$(nproc)

      - name: Build modern (arm-none-eabi-gcc)
        run: make modern -j$(nproc)

      - name: Upload ROMs
        uses: actions/upload-artifact@v4
        with:
          name: roms-${{ github.sha }}
          path: |
            pokeemerald.gba
            pokeemerald_modern.gba
          retention-days: 14
