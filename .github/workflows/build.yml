name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: LEAN=1 bash tools/setup-cloud.sh

      - name: Build (modern arm-none-eabi-gcc)
        run: make -j$(nproc)

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: rom-${{ github.sha }}
          path: pokeemerald_modern.gba
          retention-days: 14

  # gamedata.py reads the C sources with regexes; fail if a refactor makes it parse less
  balance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Balance model still parses the sources
        run: python3 tools/balance/test_gamedata.py
